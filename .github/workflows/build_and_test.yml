---
name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: &install-deps |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            libx11-dev \
            libxcb1-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            glslc \
            spirv-headers \
            vulkan-utility-libraries-dev \
            libvulkan-dev \
            make \
            meson \
            ninja-build \
            pkg-config

      - name: Setup build directory
        run: meson setup build

      - name: Compile
        run: meson compile -C build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: *install-deps

      - name: Setup build directory
        run: meson setup build -Dtests=true

      - name: Run tests
        run: meson test -C build --suite vkShade
